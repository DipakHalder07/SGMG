    <!-- SGMG Website Loader Styles -->
    <style>
      #sgmg-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity .5s ease, visibility .5s ease;
      }
      #sgmg-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #sgmg-loader svg {
        width: 140px;
        height: 140px;
        overflow: visible;
      }
      @media (max-width: 600px) {
        #sgmg-loader svg {
          width: 110px;
          height: 110px;
        }
      }

      #sgmg-loader .sq {
        transform-box: fill-box;
        transform-origin: center;
        animation: sgmg-pop 2.8s var(--d) infinite cubic-bezier(.2, .8, .2, 1) both;
      }
      #sgmg-loader .ln {
        stroke: #fff;
        stroke-dasharray: 440;
        animation: sgmg-line 2.8s var(--d) infinite ease-out both;
      }
      #sgmg-loader .lt {
        fill: #fff;
        transform-box: fill-box;
        transform-origin: center;
        animation: sgmg-letter 2.8s var(--d) infinite cubic-bezier(.2, .8, .2, 1) both;
      }

      @keyframes sgmg-pop {
        0% { transform: scale(0); opacity: 0; }
        12% { transform: scale(1.07); opacity: 1; }
        18%, 80% { transform: scale(1); opacity: 1; }
        92%, 100% { transform: scale(.88); opacity: 0; }
      }
      @keyframes sgmg-line {
        0%, 16% { stroke-dashoffset: 440; opacity: 1; }
        32%, 80% { stroke-dashoffset: 0; opacity: 1; }
        92%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes sgmg-letter {
        0%, 24% { opacity: 0; transform: translateY(30px); }
        38%, 80% { opacity: 1; transform: translateY(0); }
        92%, 100% { opacity: 0; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        #sgmg-loader * { animation: none !important; }
      }
    </style>

    <!-- SGMG Website Loader Hide Script -->
    <script>
      (function(){
        var loader = document.getElementById('sgmg-loader');
        if (!loader) return;
        var MIN_SHOW = 1400; // ms: show at least one full build so it never just flickers
        var start = Date.now();
        function hide(){
          var wait = Math.max(0, MIN_SHOW - (Date.now() - start));
          setTimeout(function(){
            loader.classList.add('is-done');
            window.__sgmg_initial_loader_shown = true;
            setTimeout(function(){
              if (loader && loader.parentNode) {
                loader.remove();
              }
            }, 600);
          }, wait);
        }
        if (document.readyState === 'complete') {
          hide();
        } else {
          window.addEventListener('load', hide);
        }
        // Safety net: never block the site for more than 8 seconds
        setTimeout(hide, 8000);
      })();
    </script>
