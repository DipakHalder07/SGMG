<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="8" fill="#ffffff" />
  <!-- 2x2 Grid -->
  <!-- Top Left: S -->
  <rect x="5" y="5" width="26" height="26" rx="2" fill="#2391cf" />
  <text x="18" y="24" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" text-anchor="middle">S</text>
  <!-- Top Right: G -->
  <rect x="33" y="5" width="26" height="26" rx="2" fill="#2391cf" />
  <text x="46" y="24" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" text-anchor="middle">G</text>
  <!-- Bottom Left: M -->
  <rect x="5" y="33" width="26" height="26" rx="2" fill="#a2cd3a" />
  <text x="18" y="52" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" text-anchor="middle">M</text>
  <!-- Bottom Right: G -->
  <rect x="33" y="33" width="26" height="26" rx="2" fill="#a2cd3a" />
  <text x="46" y="52" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" text-anchor="middle">G</text>
</svg>
